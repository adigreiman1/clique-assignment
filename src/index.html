<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Clique Check-ins</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 700px;
      margin: 40px auto;
      padding: 0 20px;
      background: #f2fafd;
    }

    h1 {
      color: #1f7a9e;
    }

    .controls {
      margin-bottom: 20px;
    }

    input {
      border: 1px solid #8fd3ea;
      border-radius: 4px;
      padding: 4px 6px;
    }

    button {
      background: #4fb8de;
      color: white;
      border: none;
      border-radius: 4px;
      padding: 6px 14px;
      cursor: pointer;
    }

    button:hover {
      background: #2fa3cf;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
    }

    th, td {
      padding: 10px 14px;
      text-align: center;
      border-bottom: 1px solid #d3eef8;
    }

    th {
      background: #4fb8de;
      color: white;
    }

    tr:hover {
      background: #e6f6fc;
    }

    .breakdown {
      display: grid;
      grid-template-columns: auto auto;
      justify-content: center;
      column-gap: 12px;
      row-gap: 6px;
      max-width: 320px;
      margin: 0 auto;
      text-align: left;
    }

    /* The line wrapper adds no box, so its two spans become cells of .breakdown */
    .reason {
      display: contents;
    }

    .badge {
      justify-self: start;
      background: #d3eef8;
      color: #1f7a9e;
      border-radius: 10px;
      padding: 1px 10px;
      font-size: 12px;
    }

    #message {
      text-align: center;
      color: #5f8c9c;
    }
  </style>
</head>

<body>
  <h1>Members due for check-in</h1>

  <div class="controls">
    <label>Date: <input type="date" id="date" value="2025-11-05"></label>
    <label>Top: <input type="number" id="top" value="5" min="1"></label>
    <button id="load">Show</button>
  </div>

  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Priority score</th>
        <th>Recommended window</th>
        <th></th>
      </tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>

  <p id="message"></p>

  <script>
    async function loadRows() {
      const date = document.getElementById("date").value;
      const top = document.getElementById("top").value;

      const response = await fetch(`/due?top=${top}&date=${date}`);
      const members = await response.json();

      const rows = document.getElementById("rows");
      const message = document.getElementById("message");
      rows.innerHTML = "";

      if (members.length === 0) {
        message.textContent = "No members due for check-in on this date.";
      } else {
        message.textContent = "";
      }

      for (const m of members) {
        const tr = document.createElement("tr");
        for (const value of [m.member_id, m.full_name, m.priority_score, m.recommended_window]) {
          const td = document.createElement("td");
          td.textContent = value;
          tr.appendChild(td);
        }

        // Hidden row under the member that holds the breakdown
        const detailsRow = document.createElement("tr");
        detailsRow.hidden = true;
        const detailsCell = document.createElement("td");
        detailsCell.colSpan = 5;
        const list = document.createElement("div");
        list.className = "breakdown";
        for (const b of m.score_breakdown) {
          const line = document.createElement("div");
          line.className = "reason";

          const reason = document.createElement("span");
          reason.textContent = b.reason;

          const badge = document.createElement("span");
          badge.className = "badge";
          badge.textContent = `+${b.points.toFixed(1)}`;

          line.appendChild(reason);
          line.appendChild(badge);
          list.appendChild(line);
        }
        detailsCell.appendChild(list);
        detailsRow.appendChild(detailsCell);

        const button = document.createElement("button");
        button.textContent = "Details";
        button.addEventListener("click", () => {
          detailsRow.hidden = !detailsRow.hidden;
        });
        const buttonCell = document.createElement("td");
        buttonCell.appendChild(button);
        tr.appendChild(buttonCell);

        rows.appendChild(tr);
        rows.appendChild(detailsRow);
      }
    }

    document.getElementById("load").addEventListener("click", loadRows);

    loadRows();
  </script>
</body>
</html>
